
name: イベント照合画面を追加

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: コード取得
        uses: actions/checkout@v4

      - name: イベント画面更新
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("events.html")
          html = path.read_text(encoding="utf-8")

          marker = 'id="verificationPanel"'

          if marker in html:
              print("照合画面は追加済みです")
              raise SystemExit(0)

          panel = """
          <section class="panel" id="verificationPanel">
            <h2>イベント開催確認・照合結果</h2>
            <p class="note">
              イベントの掲載履歴と差枚実績を照合。
              差枚データがあるだけでは開催確認済みになりません。
            </p>

            <div class="stats">
              <div class="stat">
                <small>登録イベント</small>
                <strong id="verifyTotal">--</strong>
              </div>
              <div class="stat">
                <small>開催確認済み</small>
                <strong id="verifyConfirmed">--</strong>
              </div>
              <div class="stat">
                <small>分析可能</small>
                <strong id="verifyReady">--</strong>
              </div>
              <div class="stat">
                <small>未確認・実績あり</small>
                <strong id="verifyPendingActual">--</strong>
              </div>
            </div>

            <h3>イベント別の確認状況</h3>
            <div id="verificationRows">
              <p class="note">照合結果を読み込み中...</p>
            </div>
            <p class="note" id="verificationUpdated"></p>
          </section>
          """

          script = """
          <script>
          (function(){
            const file =
              "https://raw.githubusercontent.com/" +
              "k4thy949rw-lang/slotnavi-kansai-pro/" +
              "main/data/mihara_event_verification.json";

            const byId = id => document.getElementById(id);

            const safe = value =>
              String(value ?? "").replace(
                /[&<>"']/g,
                c => ({
                  "&":"&amp;",
                  "<":"&lt;",
                  ">":"&gt;",
                  '"':"&quot;",
                  "'":"&#39;"
                })[c]
              );

            async function loadVerification(){
              const target = byId("verificationRows");

              try {
                const response = await fetch(
                  file + "?t=" + Date.now(),
                  {cache:"no-store"}
                );

                if (!response.ok) {
                  throw new Error("HTTP " + response.status);
                }

                const data = await response.json();

                byId("verifyTotal").textContent =
                  data.total_events ?? 0;

                byId("verifyConfirmed").textContent =
                  data.confirmed_events ?? 0;

                byId("verifyReady").textContent =
                  data.analysis_ready_events ?? 0;

                byId("verifyPendingActual").textContent =
                  data.unverified_with_actual ?? 0;

                const rows = Array.isArray(data.events)
                  ? data.events : [];

                if (!rows.length) {
                  target.innerHTML =
                    '<div class="empty">登録イベントなし</div>';
                  return;
                }

                target.innerHTML = rows.map(e => {
                  const confirmed =
                    e.status === "confirmed";

                  const badge = confirmed
                    ? "確認済み" : "未確認";

                  const badgeClass = confirmed
                    ? "confirmed" : "pending";

                  const actual = e.actual_available
                    ? "差枚実績あり（" +
                      Number(e.actual_units || 0) +
                      "台）"
                    : "差枚実績なし";

                  const ready = e.analysis_ready
                    ? "分析可能"
                    : "分析対象外";

                  return `
                    <div class="item">
                      <div class="item-title">
                        ${safe(e.date)}
                        ${safe(e.name)}
                      </div>
                      <span class="tag">
                        ${safe(e.type)}
                      </span>
                      <span class="tag ${badgeClass}">
                        ${badge}
                      </span>
                      <span class="tag">
                        ${safe(actual)}
                      </span>
                      <span class="tag">
                        ${ready}
                      </span>
                      <p class="note">
                        ${safe(e.reason)}
                      </p>
                    </div>
                  `;
                }).join("");

                byId("verificationUpdated").textContent =
                  "最終照合：" +
                  new Date(data.updated_at)
                    .toLocaleString("ja-JP", {
                      timeZone:"Asia/Tokyo"
                    });

              } catch(error) {
                target.innerHTML =
                  '<div class="empty">' +
                  '照合結果を取得できませんでした。' +
                  '</div>';
                console.error(error);
              }
            }

            loadVerification();
          })();
          </script>
          """

          if "</main>" not in html:
              raise SystemExit("mainタグが見つかりません")

          if "</body>" not in html:
              raise SystemExit("bodyタグが見つかりません")

          html = html.replace(
              "</main>",
              panel + "\n</main>",
              1
          )

          html = html.replace(
              "</body>",
              script + "\n</body>",
              1
          )

          path.write_text(
              html,
              encoding="utf-8"
          )

          print("イベント照合画面を追加しました")
          PY

      - name: 変更を保存
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add events.html
          if ! git diff --cached --quiet; then
            git commit -m "Add event verification panel"
            git pull --rebase
            git push
          fi
