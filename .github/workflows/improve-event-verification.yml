
name: イベント掲載確認機能を強化

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  improve:
    runs-on: ubuntu-latest

    steps:
      - name: コード取得
        uses: actions/checkout@v4

      - name: イベント照合処理を更新
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("event_verifier.py")
          source = path.read_text(encoding="utf-8")

          marker = "        rows.append({\n"

          addition = (
              '        # 告知掲載と実際の開催を区別する\n'
              '        last_seen = str(event.get("last_collected_at") or "")\n'
              '        listed_on_event_day = last_seen[:10] == date\n'
              '        listing_status = (\n'
              '            "当日掲載確認" if listed_on_event_day\n'
              '            else "掲載履歴あり" if event.get("source")\n'
              '            else "掲載情報なし"\n'
              '        )\n\n'
          )

          if '"listing_status": listing_status' not in source:
              if marker not in source:
                  raise SystemExit("挿入位置が見つかりません")

              source = source.replace(
                  marker,
                  addition + marker,
                  1
              )

              source = source.replace(
                  '            "manual_record": (',
                  '            "listing_status": listing_status,\n'
                  '            "listed_on_event_day": listed_on_event_day,\n'
                  '            "manual_record": (',
                  1
              )

              path.write_text(source, encoding="utf-8")

          print("イベント掲載確認機能を更新しました")
          PY

      - name: Python構文確認
        run: python -m py_compile event_verifier.py

      - name: 照合データ更新
        run: python event_verifier.py

      - name: 変更を保存
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add event_verifier.py data/mihara_event_verification.json

          if ! git diff --cached --quiet; then
            git commit -m "Add event listing verification"
            git pull --rebase
            git push
          fi
