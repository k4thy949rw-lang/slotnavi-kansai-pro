
name: スロナビ関西PRO 自動収集・分析

on:
  workflow_dispatch:
  schedule:
    - cron: '7,22,37,52 * * * *'

permissions:
  contents: write

concurrency:
  group: slotnavi-collector
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest

    steps:
      - name: コード取得
        uses: actions/checkout@v4

      - name: Python準備
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 台データ収集
        run: python collector.py

      - name: 狙い台ランキング分析
        run: python analyzer.py

      - name: 曜日・特定日分析
        run: python trend_analyzer.py

      - name: 台番号別の履歴分析
        run: python history_analyzer.py

      - name: データ・分析結果保存
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if ! git diff --cached --quiet; then
            git commit -m "Update slot data and analysis"
            git push
          fi
